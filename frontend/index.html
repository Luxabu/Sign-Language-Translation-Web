<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sign Language Web</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Setup Modal Styles */
      .api-config-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 10000;
        justify-content: center;
        align-items: center;
      }
      .api-config-modal.show {
        display: flex;
      }
      .api-config-content {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        max-width: 500px;
        width: 90%;
      }
      .api-config-content h2 {
        margin: 0 0 20px 0;
        font-size: 24px;
        color: #333;
        font-family: 'Inter', sans-serif;
      }
      .api-config-content p {
        margin: 10px 0;
        font-size: 14px;
        color: #666;
        font-family: 'Inter', sans-serif;
        line-height: 1.6;
      }
      .api-config-form {
        margin: 30px 0;
      }
      .api-config-form label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
      }
      .api-config-form input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        font-family: 'Inter', sans-serif;
        box-sizing: border-box;
      }
      .api-config-form input:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
      }
      .api-config-buttons {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      .api-config-buttons button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        transition: all 0.3s ease;
      }
      .api-config-buttons .btn-primary {
        background: #007bff;
        color: white;
      }
      .api-config-buttons .btn-primary:hover {
        background: #0056b3;
      }
      .api-config-buttons .btn-secondary {
        background: #f0f0f0;
        color: #333;
      }
      .api-config-buttons .btn-secondary:hover {
        background: #e0e0e0;
      }
      .api-config-examples {
        background: #f5f5f5;
        padding: 15px;
        border-radius: 6px;
        margin-top: 20px;
        font-size: 12px;
        font-family: 'Courier New', monospace;
        color: #666;
        line-height: 1.6;
      }
    </style>
    <script>
      // API Config Setup
      (function() {
        const params = new URLSearchParams(window.location.search);
        const apiBaseParam = params.get('apiBase');
        
        // Check from URL query param first
        if (apiBaseParam) {
          window.API_BASE = apiBaseParam;
          localStorage.setItem('api_base', apiBaseParam);
        } else {
          // Check from localStorage
          const saved = localStorage.getItem('api_base');
          if (saved) {
            window.API_BASE = saved;
          }
        }
      })();

      // Show config modal if API_BASE not set
      window.addEventListener('DOMContentLoaded', function() {
        if (!window.API_BASE) {
          const modal = document.getElementById('apiConfigModal');
          if (modal) {
            modal.classList.add('show');
          }
        }
      });

      function saveApiConfig() {
        const host = document.getElementById('apiHost').value.trim();
        const port = document.getElementById('apiPort').value.trim();
        
        if (!host) {
          alert('Please enter Raspberry Pi IP or hostname');
          return;
        }
        
        const portNum = port || '8000';
        const apiBase = `http://${host}:${portNum}`;
        
        window.API_BASE = apiBase;
        localStorage.setItem('api_base', apiBase);
        
        document.getElementById('apiConfigModal').classList.remove('show');
        location.reload();
      }

      function resetApiConfig() {
        localStorage.removeItem('api_base');
        delete window.API_BASE;
        location.reload();
      }

      function handleConfigKeypress(e) {
        if (e.key === 'Enter') {
          saveApiConfig();
        }
      }
    </script>
    <script type="module" crossorigin src="/assets/index-zG5upcG4.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DPWRYGZV.css">
    <script>
      
      const currentHost = window.location.hostname;
      window.API_BASE = "http://" + currentHost + ":8000";
      window.WS_BASE = "ws://" + currentHost + ":8000/ws";
    </script>
  </head>
  <body>
    <!-- API Configuration Modal -->
    <div id="apiConfigModal" class="api-config-modal">
      <div class="api-config-content">
        <h2>⚙️ Backend Configuration</h2>
        <p>This app needs to connect to a backend running on Raspberry Pi.</p>
        <p><strong>Enter the Raspberry Pi's IP address or hostname:</strong></p>
        
        <div class="api-config-form">
          <label for="apiHost">Raspberry Pi IP or Hostname</label>
          <input 
            type="text" 
            id="apiHost" 
            placeholder="e.g., 192.168.1.100 or raspberrypi.local"
            onkeypress="handleConfigKeypress(event)"
            autofocus
          />
          
          <label for="apiPort">Backend Port (optional, default: 8000)</label>
          <input 
            type="text" 
            id="apiPort" 
            placeholder="8000"
            onkeypress="handleConfigKeypress(event)"
          />
        </div>

        <div class="api-config-buttons">
          <button class="btn-primary" onclick="saveApiConfig()">Connect</button>
          <button class="btn-secondary" onclick="resetApiConfig()">Reset</button>
        </div>

        <div class="api-config-examples">
          <strong>Examples:</strong><br/>
          IP: 192.168.1.100<br/>
          Hostname: raspberrypi.local<br/>
          Hostname: my-pi<br/>
          <br/>
          <strong>How to find your Pi IP:</strong><br/>
          On Pi: <code>hostname -I</code>
        </div>
      </div>
    </div>

    <div id="root"></div>

  </body>
</html>
